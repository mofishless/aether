name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 必跑：ConPTY / 进程树 / .cmd 是已知最大坑源（调研 06 §9.1）
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # E2E 只用 Playwright _electron 拉起应用，无需下载浏览器
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint（oxlint + oxfmt --check）
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Spike（node:sqlite @ ELECTRON_RUN_AS_NODE）
        run: pnpm spike:node-sqlite

      - name: Build desktop
        run: pnpm build

      - name: Install Electron system deps (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @aether/desktop exec playwright install-deps chromium

      - name: E2E smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-serverargs --server-args="-screen 0 1280x1024x24" pnpm test:e2e

      - name: E2E smoke (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e
